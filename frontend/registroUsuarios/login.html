<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTARM | Iniciar sesion</title>
    <link rel="icon" href="/img/Logo.png" />
    <link rel="stylesheet" href="/vendor/fontawesome-free/css/all.min.css" />
    <link rel="stylesheet" href="/css/estilos.css" />
  </head>
  <body class="pagina-login">
    <main class="contenedor-login">
      <img src="/img/Logo.png" class="logo-login" alt="Fiscalia General del Estado" />
      <h1>Partes de transito</h1>
      <h2>Iniciar sesion</h2>
      <p>Ingresa tu correo electronico para iniciar sesion</p>

      <form id="loginForm" class="formulario-login">
        <input type="email" id="correo" placeholder="correoelectronico@dominio.com" autocomplete="email" required />

        <div class="campo-password">
          <input type="password" id="password" placeholder="Contrasena" autocomplete="current-password" required />
          <button id="btnVerPassword" type="button" title="Mostrar contrasena">
            <i class="far fa-eye"></i>
          </button>
        </div>

        <button id="btnSubmit" class="btn-login" type="submit">Iniciar sesion</button>
      </form>

      <div class="separador-login">
        <span></span>
        <p>o continuar con</p>
        <span></span>
      </div>

      <button class="btn-google" type="button">
        <strong>G</strong>
        <span>Google</span>
      </button>

      <p class="terminos">
        Al hacer clic en Continuar aceptas nuestros<br />
        <b>Terminos de servicio</b> y la Politica de privacidad
      </p>
    </main>

    <script src="/vendor/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="/registroUsuarios/login.js"></script>
  </body>
</html>
