<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal | Partes de transito</title>
    <link rel="icon" type="image/png" href="/img/Logo.png" />
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="side-brand" href="/inicio.html"
          ><span class="brand-icon"><img src="/img/iconos/menu.png" alt="" /></span
          ><span class="brand-text">Menu</span></a
        >
        <nav class="side-nav">
          <a data-page="inicio" href="/inicio.html"
            ><span class="nav-icon"><img src="/img/iconos/Inicio.png" alt="" /></span
            ><span>Inicio</span></a
          >
          <div class="side-section">Administracion</div>
          <a data-page="personal" href="/personal.html"
            ><span class="nav-icon"><img src="/img/iconos/personal.png" alt="" /></span
            ><span>Personal</span></a
          ><a data-page="partes" href="/partes.html"
            ><span class="nav-icon"
              ><img src="/img/iconos/gestion.png" alt="" /></span
            ><span>Gestionar partes</span></a
          ><a data-page="historial" href="/historial.html"
            ><span class="nav-icon"><img src="/img/iconos/historial.png" alt="" /></span
            ><span>Historial</span></a
          >
          <div class="side-section">Sesion</div>
          <button onclick="logout()">
            <span class="nav-icon"><img src="/img/iconos/salida.png" alt="" /></span
            ><span>Cerrar sesion</span></button
          ><button class="collapse-btn" onclick="toggleSidebar()">
            <span class="nav-icon"><i class="fas fa-chevron-left"></i></span
            ><span>Ocultar</span>
          </button>
        </nav>
      </aside>
      <main class="content">
        <header class="topbar">
          <a href="/inicio.html"
            ><img class="logo" src="/img/Logo.png" alt="FGE"
          /></a>
          <div class="user-menu">
            <button class="user-top" type="button">
              <i class="fas fa-bell"></i><span data-user-name></span
              ><img data-user-photo alt="Perfil" />
            </button>
            <div class="user-dropdown animated--grow-in">
              <a href="/perfil.html"><i class="fas fa-user"></i> Perfil</a
              >
            </div>
          </div>
        </header>
        <section class="page">
          <div class="toolbar">
            <h1>Panel de Personal</h1>
            <div class="toolbar-right">
              <a class="btn" href="/perfil.html"
                ><i class="fas fa-user-circle"></i> Perfil</a
              ><button class="btn green" onclick="openUserModal('create')">
                <i class="fas fa-user-plus"></i> Nuevo Usuario
              </button>
            </div>
          </div>
          <div class="toolbar-left">
            <input
              id="userSearch"
              class="search"
              placeholder="Buscar Usuario"
            /><button class="btn" onclick="loadUsers()">
              <i class="fas fa-filter"></i> Filtrar</button
            ><button class="btn icon-only"><i class="fas fa-list"></i></button
            ><button class="btn icon-only"><i class="fas fa-th"></i></button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Rol</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="userRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="userModal" class="modal-backdrop">
      <div class="modal">
        <div class="modal-title">
          <h2 id="userModalTitle">Nuevo Empleado</h2>
          <button class="modal-close" onclick="closeModal('userModal')">
            X
          </button>
        </div>
        <form id="userForm" class="modal-body">
          <input type="hidden" name="id_usuario" />
          <div class="form-grid cols-2">
            <label
              >Nombre Completo<input
                name="nombre"
                placeholder="Apellido Paterno - Apellido Materno - Nombre(s)" /></label
            ><label
              >Institucion<input
                name="instituto"
                placeholder="Selecciona institucion..." /></label
            ><label
              >Correo<input
                type="email"
                name="correo"
                placeholder="correoelectronico@dominio.com" /></label
            ><label
              >Rol<select name="id_rol">
                <option value="1">Administrador</option>
                <option value="2">Capturista</option>
                <option value="3">Consulta</option>
              </select></label
            >
          </div>
          <label
            >Contrasena<input
              type="password"
              name="password"
              placeholder="Dejar vacia al editar para conservar" /></label
          ><label
            >Cargo/Grado<input
              name="cargo_grado"
              placeholder="Cargo o grado" /></label
          ><strong>Fotografia</strong>
          <div class="photo-box">
            <img
              id="userPreview"
              class="profile-avatar"
              src="/img/usuario.png"
              alt="Vista previa"
            /><label
              >Seleccionar Fotografia<input
                type="file"
                name="imagen"
                accept="image/*"
            /></label>
          </div>
          <div class="form-actions">
            <button
              type="button"
              class="btn red"
              onclick="closeModal('userModal')"
            >
              Cancelar</button
            ><button class="btn green" id="userSubmit">Crear Nuevo</button>
          </div>
        </form>
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <div id="confirmModal" class="modal-backdrop">
      <div class="modal small">
        <div class="modal-title"><h2 data-confirm-title></h2></div>
        <div class="modal-body" style="text-align: center">
          <div class="alert-icon">!</div>
          <p data-confirm-text></p>
          <div class="form-actions">
            <button class="btn" data-confirm-no>Cancelar</button
            ><button class="btn red" data-confirm-yes>Aceptar</button>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/common.js"></script>
    <script src="/js/personal.js"></script>
    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="/js/sb-admin-2.min.js"></script>
  </body>
</html>
