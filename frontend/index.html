<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partes de transito</title>
    <link rel="icon" type="image/png" href="/img/Logo.png" />
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body class="auth-page">
    <main class="login-card">
      <img src="/img/Logo.png" alt="FGE" />
      <h1>Partes de transito</h1>
      <h2>Iniciar sesion</h2>
      <p>Ingresa tu correo electronico para iniciar sesion</p>
      <form id="loginForm">
        <input type="email" name="correo" placeholder="correoelectronico@dominio.com" required />
        <div class="password-wrap">
          <input type="password" name="password" placeholder="Contrasena" required />
          <button type="button" onclick="togglePassword(this)" aria-label="Mostrar contrasena"><i class="fas fa-eye"></i></button>
        </div>
        <button type="submit">Iniciar sesion</button>
      </form>
      <small>o continuar con</small>
      <div class="google-button"><strong>G</strong> Google</div>
      <p><small>Al hacer clic en Continuar aceptas nuestros terminos de servicio y politicas.</small></p>
    </main>
    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
